name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, build y pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Las pruebas no usan la base, pero `lib/config.ts` exige estas variables.
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      JWT_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      # Pruebas + cobertura (reporte `lcov` para SonarCloud y `html` para bajarlo como artefacto).
      - run: npm run test:coverage
      # El lcov que genera Vitest usa rutas relativas a backend/; SonarCloud las necesita desde la raíz del repo.
      - run: sed -i 's#^SF:#SF:backend/#' coverage/lcov.info
      - name: Publicar pruebas y cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-pruebas-y-cobertura-${{ github.run_number }}
          # Al re-ejecutar todos los jobs el nombre se repite: se reemplaza el del intento anterior.
          overwrite: true
          # La ruta es relativa a la raíz del repo, no al working-directory del job.
          path: |
            backend/coverage
            backend/test-results
          retention-days: 14
          if-no-files-found: warn

  frontend:
    name: Frontend (typecheck, build y lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Como el Dockerfile: pnpm viene con corepack, sin actions de terceros.
      - run: corepack enable && corepack prepare pnpm@10.29.3 --activate
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm run build
      # `main` arrastra 46 errores de lint que ya estaban antes de la Parte 3, así que por
      # ahora no frena el PR. Cuando se limpien, se saca `continue-on-error`.
      - run: pnpm run lint
        continue-on-error: true

  sonarcloud:
    name: Análisis SonarCloud
    needs: backend
    runs-on: ubuntu-latest
    # Sin el secreto (todavía no se dio de alta, o PR de Dependabot o de un fork) el análisis se saltea
    # en lugar de dejar el check en rojo.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo para detectar código nuevo
      - uses: actions/download-artifact@v4
        with:
          name: backend-pruebas-y-cobertura-${{ github.run_number }}
          path: backend
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          # Falla el job si el Quality Gate no pasa (así el check del PR queda en rojo).
          args: >
            -Dsonar.qualitygate.wait=true
