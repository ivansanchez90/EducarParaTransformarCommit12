# SonarCloud (SonarQube Cloud). Los dos valores marcados se copian desde la pantalla de alta del proyecto en sonarcloud.io.
sonar.organization=[COMPLETAR: clave de la organización en SonarCloud]
sonar.projectKey=[COMPLETAR: clave del proyecto, p. ej. <organizacion>_EducarParaTransformarCommit12]
sonar.projectName=Educar para Transformar
sonar.sourceEncoding=UTF-8

# Código propio: API y SPA. Las pruebas del backend viven en backend/test.
sonar.sources=backend/src,frontend/src
sonar.tests=backend/test
sonar.test.inclusions=backend/test/**/*.test.ts
sonar.exclusions=backend/src/generated/**,**/node_modules/**,**/dist/**,frontend/public/**

# Cobertura: solo el backend tiene pruebas (Vitest). El frontend no tiene suite todavía:
# se excluye del cálculo de cobertura para no dejar el Quality Gate en rojo de forma permanente.
# Es una limitación declarada, no un dato de calidad: cuando exista una suite de frontend se saca esta línea.
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.coverage.exclusions=frontend/**,backend/prisma/**
