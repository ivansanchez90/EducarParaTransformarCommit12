name: educar-para-transformar

services:
  postgres:
    image: postgres:17-alpine
    container_name: educar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-educar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-educar}
      POSTGRES_DB: ${POSTGRES_DB:-educar_db}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-educar} -d ${POSTGRES_DB:-educar_db}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
